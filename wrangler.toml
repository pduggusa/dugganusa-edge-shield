name = "dugganusa-edge-shield"
main = "src/worker.js"
compatibility_date = "2026-03-19"
account_id = "6a88c1dc2bef510ffb0c0393ce5c6248"

# Your DugganUSA API key — set as a secret:
#   npx wrangler secret put DUGGANUSA_API_KEY
#
# Get your key: https://analytics.dugganusa.com/stix/register

# Honeypot canary routes — intercept scanner probes on all properties
routes = [
  # Config/credential probes
  # BEACON SHIELD (2026-08-21) — routed so the edge can absorb our own tracking beacon.
  # These two paths generated 15,148 uncached origin requests during the GCP Frankfurt
  # scraper event; embed.js is now edge-cached and track is per-IP rate limited.
  # See investigations/gcp-frankfurt-scraper-2026-08-21/FINDINGS.md
  { pattern = "analytics.dugganusa.com/api/v1/blog-tracking/embed.js", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/api/v1/blog-tracking/track*", zone_name = "dugganusa.com" },

  { pattern = "analytics.dugganusa.com/.env*", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/.git/*", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/.aws/*", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/.env*", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/.git/*", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/.aws/*", zone_name = "dugganusa.com" },
  # WordPress probes
  { pattern = "analytics.dugganusa.com/wp-admin/*", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/wp-login.php", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/xmlrpc.php", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/wp-admin/*", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/wp-login.php", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/xmlrpc.php", zone_name = "dugganusa.com" },
  # Database/backup probes
  { pattern = "analytics.dugganusa.com/backup.sql*", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/dump.sql", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/db.sqlite", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/backup.sql*", zone_name = "dugganusa.com" },
  # Admin/debug probes
  { pattern = "analytics.dugganusa.com/phpmyadmin/*", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/adminer.php", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/administrator/*", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/_debug/*", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/phpmyadmin/*", zone_name = "dugganusa.com" },
  # Webshell probes
  { pattern = "analytics.dugganusa.com/shell.php", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/cmd.php", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/c99.php", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/r57.php", zone_name = "dugganusa.com" },
  # Framework recon
  { pattern = "analytics.dugganusa.com/actuator*", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/server-status", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/actuator*", zone_name = "dugganusa.com" },
  # API fishing
  { pattern = "analytics.dugganusa.com/graphql", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/graphql", zone_name = "dugganusa.com" },
  # cPanel/WHM/webmail canaries — CVE-2026-41940 wave (June 2026)
  { pattern = "analytics.dugganusa.com/cpanel*", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/whm*", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/webmail*", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/cgi-sys/*", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/cpanel*", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/whm*", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/webmail*", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/cgi-sys/*", zone_name = "dugganusa.com" },
  # NetScaler ADC / Gateway canaries — CVE-2026-88771/88772 wave (Sept 2026).
  # Route paths are case-sensitive, hence both /Citrix/* and /citrix/*.
  # Non-canary requests on these routes fall through to the origin unchanged.
  { pattern = "analytics.dugganusa.com/vpn*", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/logon/*", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/nf/auth/*", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/gwtest/*", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/Citrix/*", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/citrix/*", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/epa/scripts/*", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/oauth/idp/*", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/cgi/login", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/saml/login", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/menu/ss", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/menu/neo", zone_name = "dugganusa.com" },
  { pattern = "analytics.dugganusa.com/menu/stc", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/vpn*", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/logon/*", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/nf/auth/*", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/gwtest/*", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/Citrix/*", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/citrix/*", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/epa/scripts/*", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/oauth/idp/*", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/cgi/login", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/saml/login", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/menu/ss", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/menu/neo", zone_name = "dugganusa.com" },
  { pattern = "security.dugganusa.com/menu/stc", zone_name = "dugganusa.com" },
  # Marketing hosts — full coverage for IOC blocking + LD-JSON injection (LAYER 5)
  { pattern = "www.dugganusa.com/*", zone_name = "dugganusa.com" },
  { pattern = "dugganusa.com/*", zone_name = "dugganusa.com" },
  # PRODUCT gets protection (2026-10-05): analytics.dugganusa.com is the product API +
  # STIX feed. Full coverage so IOC blocking, rate limiting and feed-hit counting run on
  # all of it, not just canary paths. IndexNow key is served by the container (public/).
  # Same-zone subrequests (the shield's own ips.csv refresh) go to origin, not back here.
  { pattern = "analytics.dugganusa.com/*", zone_name = "dugganusa.com" },
  { pattern = "aipmsec.com/*", zone_name = "aipmsec.com" },
  # DRONE: deliberately NO catch-all on security.dugganusa.com. The drone is a SENSOR -- it
  # must see raw background radiation (scanners, probes, IOC-listed IPs). A shield in front
  # of it 418s/403s exactly the traffic it exists to observe. Only the canary paths above.
  # (A catch-all was added and rolled back 2026-10-05 for this reason.)
  { pattern = "www.aipmsec.com/*", zone_name = "aipmsec.com" },
]

[observability]
enabled = true
